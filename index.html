<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bộ công cụ nội bộ để sinh biên bản và đề nghị thanh toán từ dữ liệu Excel.">
  <title>Bộ công cụ hồ sơ - LTH</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1411;
      --surface: #171d19;
      --surface-raised: #1d2520;
      --line: #303a33;
      --text: #eef3ef;
      --muted: #9da8a0;
      --accent: #67c99e;
      --accent-soft: #203c31;
      --radius: 14px;
      --shadow: 0 22px 60px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
    }

    button { font: inherit; }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100dvh;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, .7fr) minmax(460px, 1.3fr) auto;
      align-items: center;
      gap: 24px;
      min-height: 104px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
    }

    .brand { min-width: 0; }

    .brand-name {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 750;
      letter-spacing: -.025em;
    }

    .brand-copy {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
    }

    .tool-tab {
      min-height: 50px;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      transition: background-color .18s ease, color .18s ease, transform .18s ease;
    }

    .tool-tab:hover {
      color: var(--text);
      background: var(--surface);
    }

    .tool-tab:active { transform: translateY(1px); }

    .tool-tab[aria-selected="true"] {
      color: var(--text);
      background: var(--surface-raised);
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .tab-title {
      display: block;
      font-size: .88rem;
      font-weight: 720;
    }

    .tab-meta {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: .72rem;
    }

    .view-toggle {
      min-height: 44px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 680;
      white-space: nowrap;
      transition: border-color .18s ease, background-color .18s ease, transform .18s ease;
    }

    .view-toggle:hover {
      border-color: var(--accent);
      background: var(--surface-raised);
    }

    .view-toggle:active { transform: translateY(1px); }

    .view-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .tool-tab:focus-visible,
    .view-toggle:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent);
      outline-offset: 2px;
    }

    .workspace {
      min-height: 0;
      padding: 12px;
    }

    .frames {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .frames.is-split {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1px;
      background: var(--line);
    }

    .tool-frame {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--surface);
    }

    .tool-frame.is-active,
    .frames.is-split .tool-frame {
      display: block;
    }

    .frames.is-split .tool-frame + .tool-frame {
      border-left: 1px solid var(--line);
    }

    @media (max-width: 920px) {
      body { overflow: auto; }
      .topbar {
        grid-template-columns: 1fr auto;
        gap: 14px;
        padding: 16px;
      }
      .brand { grid-column: 1 / -1; }
      .tool-nav { grid-column: 1; }
      .workspace { min-height: calc(100dvh - 184px); padding: 8px; }
      .frames.is-split {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(620px, 72dvh) minmax(620px, 72dvh);
        height: auto;
      }
      .frames.is-split .tool-frame + .tool-frame {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }

    @media (max-width: 620px) {
      .topbar { grid-template-columns: 1fr; }
      .tool-nav {
        grid-column: 1;
        grid-template-columns: 1fr;
      }
      .view-toggle { width: 100%; }
      .workspace { min-height: 720px; }
      .frames { border-radius: 10px; }
      .tab-meta { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-name">Bộ công cụ hồ sơ LTH</h1>
        <p class="brand-copy" id="current-description">Sinh biên bản nghiệm thu và thanh lý từ danh sách học viên.</p>
      </div>

      <nav class="tool-nav" aria-label="Chọn công cụ" role="tablist">
        <button class="tool-tab" data-tool="contracts" role="tab" aria-controls="frame-contracts" aria-selected="true">
          <span class="tab-title">Biên bản hợp đồng</span>
          <span class="tab-meta">Nghiệm thu và thanh lý</span>
        </button>
        <button class="tool-tab" data-tool="payments" role="tab" aria-controls="frame-payments" aria-selected="false">
          <span class="tab-title">Đề nghị thanh toán</span>
          <span class="tab-meta">Tạo hồ sơ từ danh sách chi</span>
        </button>
      </nav>

      <button class="view-toggle" id="split-toggle" type="button" aria-pressed="false">Mở song song</button>
    </header>

    <section class="workspace" aria-label="Không gian làm việc">
      <div class="frames" id="frames">
        <iframe
          class="tool-frame is-active"
          id="frame-contracts"
          data-tool="contracts"
          src="contracts.html"
          title="Công cụ sinh biên bản hợp đồng"
        ></iframe>
        <iframe
          class="tool-frame"
          id="frame-payments"
          data-tool="payments"
          src="DNTT/tool.html"
          title="Công cụ sinh đề nghị thanh toán"
        ></iframe>
      </div>
    </section>
  </main>

  <script>
    const descriptions = {
      contracts: "Sinh biên bản nghiệm thu và thanh lý từ danh sách học viên.",
      payments: "Sinh đề nghị thanh toán từ danh sách chi và mẫu Excel."
    };

    const frames = document.getElementById("frames");
    const splitToggle = document.getElementById("split-toggle");
    const description = document.getElementById("current-description");
    const tabs = [...document.querySelectorAll(".tool-tab")];
    const toolFrames = [...document.querySelectorAll(".tool-frame")];
    let activeTool = "contracts";

    function selectTool(tool) {
      activeTool = tool;
      for (const tab of tabs) {
        const selected = tab.dataset.tool === tool;
        tab.setAttribute("aria-selected", String(selected));
      }
      for (const frame of toolFrames) {
        frame.classList.toggle("is-active", frame.dataset.tool === tool);
      }
      if (!frames.classList.contains("is-split")) {
        description.textContent = descriptions[tool];
      }
    }

    function setSplit(enabled) {
      frames.classList.toggle("is-split", enabled);
      splitToggle.setAttribute("aria-pressed", String(enabled));
      splitToggle.textContent = enabled ? "Đóng chế độ song song" : "Mở song song";
      description.textContent = enabled
        ? "Hai công cụ đang mở cùng lúc. Dữ liệu trong mỗi tool được giữ riêng."
        : descriptions[activeTool];
    }

    for (const tab of tabs) {
      tab.addEventListener("click", () => {
        if (frames.classList.contains("is-split")) setSplit(false);
        selectTool(tab.dataset.tool);
      });
    }

    splitToggle.addEventListener("click", () => {
      setSplit(!frames.classList.contains("is-split"));
    });
  </script>
</body>
</html>
